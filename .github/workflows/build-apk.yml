name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rock-atlas-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK as the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk rock-atlas.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest rock-atlas.apk --title "اطلس سنگ‌های ساختمانی (آخرین نسخه)" --notes "ساخته‌شده توسط مهدی گیوکی · +989192950266 · www.nexstone.ir" --target "$GITHUB_SHA"
